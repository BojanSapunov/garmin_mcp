name: CI

# Runs on pull requests, and from deploy.yml before every deploy to main.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: garmin
          POSTGRES_PASSWORD: garmin
          POSTGRES_DB: garmin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U garmin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://garmin:garmin@localhost:5432/garmin_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # Before the tests, while the database is still empty (the tests create tables directly).
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql+psycopg://garmin:garmin@localhost:5432/garmin_test
        run: |
          alembic upgrade head
          alembic check
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t garmin-dashboard:ci .
